:root{--bg:#061014;--panel:#0d1b20;--panel2:#13272d;--line:#29444b;--fg:#edf7f5;--muted:#91aaa6;--accent:#ffb65c;--shadow:0 14px 36px rgba(0,0,0,.28);--soft:0 6px 18px rgba(0,0,0,.18)}
body{background:radial-gradient(circle at 12% 0%,rgba(79,210,232,.08),transparent 32rem),radial-gradient(circle at 100% 18%,rgba(255,182,92,.07),transparent 28rem),var(--bg);font-size:15.5px}.wrap{max-width:1280px;gap:20px}header.top{padding:4px 2px 10px;border-bottom:1px solid rgba(255,255,255,.06)}.brand{font-size:32px;letter-spacing:.035em}
.case,.trk,.tsec,.cc,.result,.support{border-color:rgba(133,177,184,.2);box-shadow:var(--soft)}.case,.trk{position:relative;overflow:hidden;border-radius:14px;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s}.case::before,.trk::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--spo2));opacity:.75}.case:hover,.trk:hover{transform:translateY(-3px);border-color:rgba(255,182,92,.7);box-shadow:0 18px 34px rgba(0,0,0,.32);background:#112328}.case h3{font-size:26px}.chip{border-radius:10px;background:#0c191d;padding:7px 13px}.game{grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:20px}
.monitor{border-radius:16px;padding:14px;background:linear-gradient(180deg,#061013,#050b0d);border-color:#29444b;box-shadow:var(--shadow)}.clock{background:rgba(255,182,92,.08);border:1px solid rgba(255,182,92,.28);padding:4px 8px;border-radius:8px}.pt{border:1px solid rgba(133,177,184,.16);border-radius:10px;overflow:hidden}canvas#ecg{height:82px;border:1px solid rgba(95,224,138,.12);border-radius:8px}.vitals{gap:8px}.vt{border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.018);border-color:rgba(133,177,184,.18)}.vt .val{font-size:28px}
.btn{border-radius:9px;padding:8px 13px;transition:transform .14s,background .14s}.btn:hover:not(:disabled){transform:translateY(-1px);background:#193139}.cc{border-radius:14px;overflow:hidden;background:rgba(13,27,32,.95)}.cc-intro{padding:16px 18px;background:linear-gradient(90deg,rgba(255,182,92,.055),transparent 45%)}.tabs{padding:7px 8px 0;gap:4px;background:#0a171b}.tab{border-radius:8px 8px 0 0;padding:10px 13px}.tab[aria-selected="true"]{background:rgba(255,182,92,.07)}.pane{padding:14px;gap:9px}.act{border-radius:9px;padding:10px 12px;transition:transform .14s,background .14s}.act:hover:not(:disabled){transform:translateY(-1px);background:#183038}.log{max-height:460px;padding:14px 16px}.result{border-radius:16px;padding:24px}.support,.tsec,.tmock,.gtoggle{border-radius:14px}
@media(max-width:860px){body{padding-inline:10px}.game{gap:12px}.monitor{border-radius:12px}.pane{grid-template-columns:1fr}.tabs{position:sticky;top:0;z-index:4}}@media(max-width:520px){body{font-size:14.5px}.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vt.bp{grid-column:span 2}.vt .val{font-size:25px}.monitor{padding:10px}.case h3{font-size:23px}}
</style>

<style>
/* Layout: bedside monitor on the left (sticky on desktop, compact strip on phone), action console + case log on the right. Deliberately single dark theme: an ER monitor. */
:root{
  color-scheme: dark;
  --bg:#0a1214; --panel:#101c1f; --panel2:#152529; --line:#21363b; --fg:#dbe8e5; --muted:#86a19c;
  --hr:#5fe08a; --spo2:#4fd2e8; --bp:#ff7a86; --rr:#f2d15c; --temp:#c9a6ff;
  --accent:#ffb347; --accent-ink:#1a1206; --ok:#5fe08a; --warn:#f2d15c; --bad:#ff5f6d;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* case select */
.intro{max-width:62ch;color:var(--muted)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s}
.case:hover{border-color:var(--accent)}
.case .fac{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.case h3{margin:0;font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15;text-wrap:balance}
.case p{margin:0;color:var(--muted);font-size:14px}
.case .go{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--fg)}

.cats{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.75}
.case .go{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:1px 6px}
.lvl-cepat,.lvl-mudah{color:var(--ok)} .lvl-sedang{color:var(--warn)} .lvl-sulit{color:var(--bad)}
.hero{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hero .intro{margin:0}
.tut{display:flex;flex-direction:column;gap:14px;max-width:860px}
.thead h2{font-family:var(--f-display);font-size:clamp(28px,5vw,40px);font-weight:700;line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0}
.tsec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.tnum{font-size:22px;font-weight:700;color:var(--accent);line-height:1.2}
.tbody{min-width:0;display:flex;flex-direction:column;gap:8px}
.tbody h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600}
.tbody p{margin:0;max-width:68ch}
.tlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
.tmock{background:#060c0d;border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;max-width:420px}
.tcap{font-size:13px;color:var(--muted)}
.tbl{display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:520px}
.tr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.tr .mono{color:var(--accent);text-align:right}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.bcard h4{margin:0 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bcard p{margin:0}
.gtoggle{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.gtoggle input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.muted{color:var(--muted);font-size:13px}
.guide{padding:12px 16px}
.guide h4{margin:0 0 6px;font-family:var(--f-display);font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.guide ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.support{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:6px;padding:16px 18px;background:rgba(255,179,71,.06)}
.stext{min-width:0;flex:1 1 320px}
.support h4{margin:0 0 4px;font-family:var(--f-display);font-size:20px;font-weight:600}
.support p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{text-decoration:none;color:var(--fg);font-weight:600;display:inline-block}
a.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.off{opacity:.5;cursor:default;font-weight:400}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.trk{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:8px;text-align:left;transition:border-color .15s}
.trk:hover{border-color:var(--accent)}
.tname{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.trk-ukmppd .tname{color:var(--spo2)} .trk-du .tname{color:var(--hr)}
.tdesc{color:var(--muted);max-width:52ch}
.trk .go{margin-top:6px}
.trkbar{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 320px}
.trkbar .intro{margin:0}
.tags{display:inline-flex;gap:6px;flex-wrap:wrap}
.pt{background:#0b1517;border-radius:4px}

const Q=(id,q,a,w)=>({id,q,a,waste:!!w});
const E=(id,label,f,w)=>({id,label,f,waste:!!w});
const L=(id,label,cost,delay,res,w)=>({id,label,cost,delay,res:typeof res==="function"?res:()=>res,waste:!!w});
const T=(id,label,dose,cost,o={})=>({id,label,dose,cost,...o});
const K=(id,label,cost,reply,w)=>({id,label,cost,reply:typeof reply==="function"?reply:()=>reply,waste:!!w});
const D=(id,label,k)=>({id,label,correct:k===1,partial:k===.5});
const P=(id,label,pts)=>({id,label,pts});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function H(s){const g=s.given;return{
  t:id=>g[id]?g[id][0]:null, n:id=>g[id]?g[id].length:0, any:(...ids)=>ids.some(i=>g[i]),
  ft:(...ids)=>{const v=ids.map(i=>g[i]?g[i][0]:null).filter(x=>x!==null);return v.length?Math.min(...v):null},
  a:id=>s.asked[id]!==undefined, x:id=>s.examined[id]!==undefined,
  lab:id=>s.tests[id]?s.tests[id].at:null, res:id=>s.tests[id]&&s.tests[id].resultAt!==undefined?s.tests[id].resultAt:null,
  c:id=>s.consulted[id]!==undefined?s.consulted[id]:null, f:s.flags, v:s.v, dispo:s.dispo};}
function tPts(t,tiers,miss=""){ if(t===null) return [0,miss]; for(const [lim,p] of tiers) if(t<=lim) return [p,`Menit ke-${fmt(t)}.`]; return [tiers[tiers.length-1][2]??0,`Menit ke-${fmt(t)}, terlambat.`]; }

function makeCase(d){
  return {...d, ecg:d.ecg||{st:0}, built:true,
    init(s){ s.flags.sev=d.sev0; s.flags.drift=d.drift; s.fxr=[]; s.mods={}; s.tmods=[]; d.init&&d.init(s); },
    tick(s){
      const m=s.lastTick; let r=s.flags.drift;
      for(const e of s.fxr) if(m>e.t && m<=e.t+e.dur) r+=e.rate;
      if(d.tick){ const rr=d.tick(s,r); if(typeof rr==="number") r=rr; }
      for(const ev of (d.events||[])) if(!s.flags["ev_"+ev.id] && m>=ev.at && (!ev.when||ev.when(s))){ s.flags["ev_"+ev.id]=true; if(ev.sev) s.flags.sev+=ev.sev; if(ev.text) s.alert(ev.text); ev.run&&ev.run(s); }
      s.flags.sev=clamp(s.flags.sev+r, d.floor??3, 100);
    },
    target(s){
      const t=d.map(s.flags.sev,s), m=s.lastTick;
      for(const [k,v] of Object.entries(s.mods)) if(t[k]!==undefined) t[k]+=v;
      for(const tm of s.tmods) if(m>=tm.t && m<=tm.t+tm.dur) for(const [k,v] of Object.entries(tm.mod)) if(t[k]!==undefined) t[k]+=v;
      if(t.dbp===undefined) t.dbp=Math.round(t.sbp*0.62);
      if(t.spo2!==undefined) t.spo2=Math.min(100,t.spo2);
      if(t.gcs!==undefined) t.gcs=clamp(t.gcs,3,15);
      return t;
    },
    onGive(s,x){
      const fx=typeof x.fx==="function"?x.fx(s):x.fx; if(!fx) return;
      const n=s.given[x.id]?s.given[x.id].length:1;
      if(fx.maxN && n>fx.maxN) return;
      if(fx.once) s.flags.sev=clamp(s.flags.sev+fx.once,d.floor??3,100);
      if(fx.rate) s.fxr.push({t:s.t,rate:fx.rate,dur:fx.dur||5});
      if(fx.cut) s.flags.drift-=fx.cut;
      if(fx.mod) for(const [k,v] of Object.entries(fx.mod)) s.mods[k]=(s.mods[k]||0)+v;
      if(fx.tmod) s.tmods.push({t:s.t,dur:fx.tdur||5,mod:fx.tmod});
      if(fx.flag) s.flags[fx.flag]=s.t;
      if(fx.alert) s.alert(fx.alert);
      if(fx.info) s.info(fx.info);
    },
    isDead(s){ return s.flags.sev>=100 || (d.dead?d.dead(s):false); },
    score(s){ const h=H(s); return d.rows.map(r=>{let o=r.f(s,h); if(!Array.isArray(o)) o=[o,""]; return row(r.label,o[0],r.max,o[1]||"");}).filter(x=>!(x.max===0&&x.pts===0)); }
  };
}

const app=document.getElementById('app');
let S=null, realtime=null, ecgState={x:0,phase:0,last:0,prevY:null};
function row(label,pts,max,note=""){return {label,pts,max,note}}
function fmt(t){return (Math.round(t*2)/2).toString().replace('.',',')}
function clockStr(t){const mm=Math.floor(t), ss=Math.round((t-mm)*60);return `T+${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}

function newState(c,guided=false){
  const s={c,t:0,lastTick:0,v:{...c.vitals},flags:{},given:{},asked:{},examined:{},tests:{},consulted:{},waste:[],pending:[],log:[],dead:false,ended:false,dx:"",dispo:"",tab:"anamnesis"};
  s.ord={history:shuffle(c.history),exam:shuffle(c.exam),tests:shuffle(c.tests),tx:shuffle(c.tx),consult:shuffle(c.consult),dx:shuffle(c.diagnoses),dispo:shuffle(c.dispositions)};
  s.alert=txt=>addLog(s,"alert",txt); s.info=txt=>addLog(s,"find",txt);
  c.init&&c.init(s);
  s.guided=guided; s.track=track;
  if(guided){ try{ s.targets=c.score(s).filter(r=>r.max>0).map(r=>r.label);}catch(e){s.targets=[];} s.targets.push("Diagnosis kerja yang tepat","Disposisi yang tepat"); }
  addLog(s,"sys",c.intro);
  return s;
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function markWaste(x,label){ if(x.waste) S.waste.push(label); }
function addLog(s,type,text){s.log.push({t:s.t,type,text}); }

function advance(min){
  if(!S||S.ended) return;
  S.t+=min;
  while(S.lastTick+1<=S.t+1e-9){
    S.lastTick++;
    S.c.tick(S);
    const tg=S.c.target(S);
    for(const k of Object.keys(tg)) if(typeof tg[k]==="number"){ S.v[k] = k==="gcs" ? tg[k] : S.v[k]+(tg[k]-S.v[k])*0.4; }
    S.pending=S.pending.filter(p=>{ if(p.due<=S.lastTick){ addLog(S,"res",p.test.res(S)); S.tests[p.test.id].resultAt=S.lastTick; return false;} return true; });
    if(S.c.isDead(S)){ S.dead=true; addLog(S,"alert","Pasien tidak teraba nadi. Henti jantung. Resusitasi tidak berhasil."); endCase(); return; }
    if(S.lastTick>=120){ addLog(S,"sys","Batas waktu kasus 120 menit tercapai."); endCase(); return; }
  }
}

function doHistory(h){ if(S.asked[h.id]!==undefined) return; addLog(S,"doc",h.q); addLog(S,"pt",h.a); S.asked[h.id]=S.t; markWaste(h,`Anamnesis: ${h.q}`); advance(0.5); render(); }
function doExam(e){ if(S.examined[e.id]) return; addLog(S,"find",`${e.label}: ${typeof e.f==="function"?e.f(S):e.f}`); S.examined[e.id]=S.t; markWaste(e,`Pemeriksaan: ${e.label}`); advance(0.5); render(); }
function doTest(x){
  if(S.tests[x.id]) return;
  addLog(S,"tx",`Order: ${x.label}`);
  advance(x.cost); if(S.ended) return render();
  S.tests[x.id]={at:S.t}; markWaste(x,`Penunjang: ${x.label}`);
  if(x.delay===0){ addLog(S,"res",x.res(S)); S.tests[x.id].resultAt=S.t; if(x.ecg12) S.log.push({t:S.t,type:"img",text:"Rekaman EKG 12 sadapan",svg:ecgSVG(x.ecg12(S))}); }
  else S.pending.push({test:x,due:Math.ceil(S.t+x.delay)});
  render();
}
function doTx(x){
  if(x.iv && !S.given.iv){ addLog(S,"alert",`${x.label} butuh akses IV. Pasang akses IV dulu.`); return render(); }
  if(S.given[x.id] && !x.repeat) return;
  if(x.unavailable){ addLog(S,"tx",`Order: ${x.label}`); addLog(S,"sys",x.unavailable); S.waste.push(`Terapi: ${x.label} (tidak tersedia)`); S.flags['un_'+x.id]=true; advance(x.cost); return render(); }
  if(!S.given[x.id]) markWaste(x,`Terapi: ${x.label}`);
  addLog(S,"tx",`${x.label} — ${x.dose}`);
  (S.given[x.id] ||= []).push(S.t);
  if(x.grantIV && !S.given.iv) S.given.iv=[S.t];
  if(S.c.onGive) S.c.onGive(S,x);
  if(x.id==="o2" && S.c.id==="stemi" && S.v.spo2>=90) addLog(S,"sys","Catatan perawat: saturasi 95% tanpa oksigen.");
  advance(x.cost); render();
}
function doConsult(k){ if(S.consulted[k.id]===undefined){ S.consulted[k.id]=S.t; markWaste(k,`Konsul: ${k.label}`);} addLog(S,"doc",k.label); advance(k.cost); if(!S.ended){ addLog(S,"pt",k.reply(S)); } render(); }
function waitMin(n){ addLog(S,"sys",`Observasi ${n} menit.`); advance(n); render(); }

function endCase(){
  if(S.ended) return; S.ended=true; stopRealtime();
  const R=S.c.score(S);
  const dx=S.c.diagnoses.find(d=>d.id===S.dx);
  R.push(row("Diagnosis kerja", dx?(dx.correct?10:dx.partial?5:0):0, 10, dx?(dx.correct?"":`Jawaban: ${dx.label}. Yang tepat: ${S.c.diagnoses.find(d=>d.correct).label}.`):"Tidak ditetapkan."));
  const dp=S.c.dispositions.find(d=>d.id===S.dispo);
  R.push(row("Disposisi", dp?dp.pts:0, 10, dp?`Dipilih: ${dp.label}.`:"Tidak ditetapkan."));
  const w=S.waste.length;
  R.push(row("Efisiensi: tindakan bernilai rendah", -Math.min(15,w*2),0, w?`${w} tindakan tidak mengubah tatalaksana: ${S.waste.join("; ")}.`:"Tidak ada tindakan yang membuang waktu."));
  const max=R.reduce((a,r)=>a+r.max,0), got=R.reduce((a,r)=>a+r.pts,0);
  let pct=Math.max(0,Math.round(got/max*100));
  if(S.dead) pct=Math.min(pct,25);
  S.result={R,pct};
}

function toggleRealtime(){ if(realtime) stopRealtime(); else { realtime=setInterval(()=>{ advance(1/6); render(true); },1000); } render(); }
function stopRealtime(){ if(realtime){clearInterval(realtime); realtime=null;} }

/* ===================== EKG 12 LEAD ===================== */
function gauss(x,mu,w,a){return a*Math.exp(-((x-mu)**2)/(2*w*w))}
const LEAD_BASE={I:{r:.7,s:.1,t:.25,p:.1},II:{r:1,s:.15,t:.3,p:.12},III:{r:.45,s:.1,t:.12,p:.06},aVR:{r:-.75,s:0,t:-.22,p:-.1},aVL:{r:.4,s:.25,t:.1,p:.04},aVF:{r:.7,s:.1,t:.2,p:.08},V1:{r:.2,s:1,t:.1,p:.06},V2:{r:.4,s:1.2,t:.4,p:.06},V3:{r:.7,s:.7,t:.4,p:.06},V4:{r:1.1,s:.4,t:.4,p:.06},V5:{r:1.1,s:.2,t:.35,p:.06},V6:{r:.9,s:.1,t:.3,p:.06}};
function ecgSVG(spec){
  const rate=Math.max(20,spec.rate||75), RR=60/rate;
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const vEv=[], aEv=[];
  if(spec.af){ let t=-1; while(t<11){ vEv.push(t); t+=RR*(0.55+rnd()*0.9);} }
  else if(spec.chb){ for(let t=-1;t<11;t+=RR) vEv.push(t+0.3); for(let t=-1;t<11;t+=0.8) aEv.push(t); }
  else { for(let t=-1;t<11;t+=RR){ aEv.push(t); vEv.push(t+0.16);} }
  const sm=(x)=>x<0?0:x>1?1:x*x*(3-2*x);
  function sig(t,L){
    let y=0;
    for(const a of aEv){ if(Math.abs(t-a)<0.15) y+=gauss(t,a,.025,L.p); }
    for(const v of vEv){ const d=t-v; if(d<-0.1||d>0.7) continue;
      y+=gauss(t,v-.025,.008,-.06)+gauss(t,v,.011,L.r)+gauss(t,v+.026,.01,-L.s);
      const st=L.st||0; if(st) y+=st*sm((d-.03)/.04)*(1-sm((d-.22)/.08));
      y+=gauss(t,v+.3,.05,L.t+(L.st||0)*.5); if(L.u) y+=gauss(t,v+.48,.035,L.u); }
    if(spec.af) y+=0.035*Math.sin(t*37)+0.025*Math.sin(t*53+1);
    return y;
  }
  const lead=n=>{const b={...LEAD_BASE[n]}; if(spec.all) for(const[k,v] of Object.entries(spec.all)) b[k]=k==="r"?b[k]*v:v; if(spec.leads&&spec.leads[n]) Object.assign(b,spec.leads[n]); if(spec.all&&spec.all.t!==undefined) b.t=LEAD_BASE[n].t*spec.all.t/0.3; return b;};
  const MM=3, PX=25*MM, MV=10*MM, x0=24, rowH=30*MM, colW=2.5*PX, W=x0+10*PX, H=rowH*4, off=19*MM;
  const grid=[];
  for(let i=0;i*MM<=10*PX;i++){const x=x0+i*MM, b=i%5===0; grid.push(`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${b?'#e3a0a0':'#f7dada'}" stroke-width="${b?0.7:0.35}"/>`);}
  for(let i=0;i*MM<=H;i++){const y=i*MM, b=i%5===0; grid.push(`<line x1="${x0}" y1="${y}" x2="${W}" y2="${y}" stroke="${b?'#e3a0a0':'#f7dada'}" stroke-width="${b?0.7:0.35}"/>`);}
  const paths=[], labels=[];
  const layout=[["I","aVR","V1","V4"],["II","aVL","V2","V5"],["III","aVF","V3","V6"]];
  const lbl=(x,y,t)=>`<text x="${x}" y="${y}" font-size="12" font-family="JetBrains Mono,monospace" fill="#5a1f1f">${t}</text>`;
  layout.forEach((row,ri)=>row.forEach((n,ci)=>{const L=lead(n), base=ri*rowH+off; let d="";
    for(let t=ci*2.5;t<=(ci+1)*2.5;t+=0.006){const x=x0+t*PX, y=base-sig(t,L)*MV; d+=(d?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);}
    paths.push(`<path d="${d}" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>`);
    labels.push(lbl(x0+ci*colW+5,ri*rowH+16,n));
    if(ci>0) paths.push(`<line x1="${x0+ci*colW}" y1="${base-12}" x2="${x0+ci*colW}" y2="${base+12}" stroke="#1b1b1b" stroke-width="1"/>`);}));
  { const L=lead("II"), base=3*rowH+off; let d=""; for(let t=0;t<=10;t+=0.006){const x=x0+t*PX, y=base-sig(t,L)*MV; d+=(d?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);} paths.push(`<path d="${d}" fill="none" stroke="#1b1b1b" stroke-width="1.2" stroke-linejoin="round"/>`); labels.push(lbl(x0+5,3*rowH+16,"II (ritme)")); }
  const cal=`<path d="M4 ${off} h5 v-${MV} h10 v${MV} h5" fill="none" stroke="#1b1b1b" stroke-width="1.2"/>`;
  return `<svg viewBox="0 0 ${W+6} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rekaman EKG 12 sadapan"><rect width="100%" height="100%" fill="#fff6f4"/>${grid.join("")}${cal}${paths.join("")}${labels.join("")}<text x="${W-6}" y="${H-6}" text-anchor="end" font-size="9" font-family="JetBrains Mono,monospace" fill="#8a4a4a">25 mm/s · 10 mm/mV</text></svg>`;
}

function mixRGB(a,b,t){return a.map((x,i)=>Math.round(x+(b[i]-x)*t))}
function patientFeatures(S){
  const v=S.v, f=S.flags, fig=S.c.fig||{sex:"m",age:"adult"}, dead=S.dead;
  const pale=dead?1:clamp((100-v.sbp)/45,0,1), cyan=dead?0.6:clamp((91-v.spo2)/14,0,1);
  const gcs=S.c.built?v.gcs:(v.sbp<65?12:15);
  const o2s=S.c.tx.filter(x=>/oksigen/i.test(x.label)&&S.given[x.id]);
  return {fig,dead,pale:Math.round(pale*10)/10,cyan:Math.round(cyan*10)/10,
    closed:dead||gcs<=10, seiz:!dead&&!!f.seiz, pain:!dead&&gcs>12&&(f.sev??45)>45,
    sweat:!dead&&(v.sbp<90||(f.sev??0)>65), o2:o2s.length?(o2s.some(x=>/NRM/.test(x.label))?"mask":"nk"):"", iv:!!S.given.iv,

/* ===================== ECG TRACE ===================== */
function g(x,mu,w,a){return a*Math.exp(-((x-mu)**2)/(2*w*w))}

  const ctx=cv.getContext("2d"), W=cv.width, H=cv.height;
  const dt=Math.min(.05,(ts-(ecgState.last||ts))/1000); ecgState.last=ts;
  if(cv!==ecgState.cv){ecgState.cv=cv; ctx.fillStyle="#050a0b"; ctx.fillRect(0,0,W,H); ecgState.prevY=null;}
  const hr=S.dead?0:Math.max(20,S.v.hr), speed=170; // px per sec

    ecgState.prevY=y; ecgState.x++; if(ecgState.x>=W){ecgState.x=0; ecgState.prevY=null;}
  }
}
